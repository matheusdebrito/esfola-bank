services:
  postgres:
    image: postgres:16-alpine
    container_name: emprestimo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - emprestimo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - emprestimo_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emprestimo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - emprestimo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - emprestimo_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emprestimo-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: "postgresql://emprestimo:emprestimo@postgres:5432/emprestimo?schema=public"
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      STORAGE_BASE_PATH: /storage/clients
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      LOG_LEVEL: ${LOG_LEVEL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@emprestimo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    ports:
      - "4000:4000"
    volumes:
      - emprestimo_storage:/storage/clients
    networks:
      - emprestimo_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${API_URL}
    ports:
      - "5173:80"
    networks:
      - emprestimo_net
    restart: unless-stopped

volumes:
  emprestimo_postgres_data:
  emprestimo_redis_data:
  emprestimo_storage:

networks:
  emprestimo_net:
    driver: bridge